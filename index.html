<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TigerTrade Terminal — leadership screener &amp; volatility radar</title>
    <!-- follows the neutral charcoal ground; #100A06 was the old warm ink and
         showed as a mismatched bar behind the page on Android -->
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="description" content="A relative-strength leadership screener, macro-catalyst surveillance and ATR position risk on one board. Every figure is real or absent — nothing is estimated." />
    <link rel="canonical" href="https://tigertradeterminal.io/" />

    <!-- SOCIAL CARDS. Without these every link anyone posts renders as a bare
         URL with no title, no description and no image, which is a marketing
         channel thrown away for the sake of six tags.
         The image is BRAND-ONLY and generated by scripts/og.mjs — see the note
         at the top of that file for why it must not be a screenshot: every shot
         this repo can take headlessly comes from the synthetic fixture, and
         fabricated prices on the card that represents the product everywhere it
         is shared would break the one rule the codebase is built on. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TigerTrade Terminal" />
    <meta property="og:url" content="https://tigertradeterminal.io/" />
    <meta property="og:title" content="TigerTrade Terminal — leadership screener &amp; volatility radar" />
    <meta property="og:description" content="Relative-strength leadership, macro-catalyst surveillance and ATR position risk on one board. Every figure is real or absent." />
    <meta property="og:image" content="https://tigertradeterminal.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TigerTrade Terminal — every figure is real or absent." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TigerTrade Terminal — leadership screener &amp; volatility radar" />
    <meta name="twitter:description" content="Relative-strength leadership, macro-catalyst surveillance and ATR position risk on one board. Every figure is real or absent." />
    <meta name="twitter:image" content="https://tigertradeterminal.io/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- `currentColor` cannot resolve inside <link rel="icon">: the currentColor
         mark renders as flat black there. These two are tiled and explicit, and
         the media queries let the tab icon follow the OS theme. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <!-- the 16px PNG carries the SINGLE slash: below 16px the 3.4 stroke closes
         the gaps and the three slashes fuse into one wedge -->
    <link rel="icon" type="image/png" href="/icon-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TigerTrade" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter Tight, not Space Grotesk. Grotesk's quirks — the single-storey `a`,
         the flat-sided `S`, the wide `x` — read as personality on a landing page
         and as noise across 500 dense rows, and it is the most-recognisable
         "designed in 2024" display face there is. Inter Tight keeps a neutral
         grotesque skeleton, sets tighter so headings hold their own without
         extra weight, and has true tabular figures for the columns. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
